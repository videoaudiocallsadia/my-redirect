<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connecting...</title>
  
  <!-- Facebook ও অন্যান্য রোবট যাতে লিংক ট্র্যাক না করে -->
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at center, #1e293b, #0f172a);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      padding: 35px 25px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      max-width: 380px;
      width: 100%;
    }
    .loader {
      position: relative;
      width: 55px;
      height: 55px;
      margin: 0 auto 20px;
    }
    .loader div {
      box-sizing: border-box;
      display: block;
      position: absolute;
      width: 48px;
      height: 48px;
      margin: 4px;
      border: 4px solid #38bdf8;
      border-radius: 50%;
      animation: loader-anim 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      border-color: #38bdf8 transparent transparent transparent;
    }
    .loader div:nth-child(1) { animation-delay: -0.45s; }
    .loader div:nth-child(2) { animation-delay: -0.3s; }
    .loader div:nth-child(3) { animation-delay: -0.15s; }
    @keyframes loader-anim {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h3 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #f8fafc;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 22px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      padding: 14px 20px;
      text-decoration: none;
      border-radius: 30px;
      font-weight: 600;
      font-size: 16px;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
      transition: transform 0.2s, background 0.2s;
    }
    .btn:hover {
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="loader">
      <div></div><div></div><div></div><div></div>
    </div>
    <h3>কানেক্ট করা হচ্ছে...</h3>
    <p>অনুগ্রহ করে ১ সেকেন্ড অপেক্ষা করুন</p>
    
    <!-- ব্যাকআপ বাটন (কাস্টমার চাইলে সরাসরি ক্লিক করতে পারবে) -->
    <a id="redirectBtn" href="#" class="btn">সরাসরি যুক্ত হন 👉</a>
  </div>

  <script>
    // আপনার টার্গেট লিংক
    const targetUrl = "https://parolerecently.com/e4wB/4m3g8qovL_/c5j2AbTVefo/D3u9u47ZV0/DL9/r_IbHE/fjFuZDpfWHX/Xmk2w/kUKV9QvpTr/FEdMy/Azn/2Bp5xvfENWhHi6w/Oi6D8-/_TGtR/xdiNRm1jsn/S2k3sRuQZ/hlAbo";

    // বাটনে লিংক সেট করা
    const btn = document.getElementById("redirectBtn");
    if (btn) {
      btn.href = targetUrl;
    }

    // ১ সেকেন্ড পর স্বয়ংক্রিয় রিডাইরেক্ট
    setTimeout(function() {
      window.location.replace(targetUrl);
    }, 1000);
  </script>

</body>
</html>
